    </text>

    <text x="60" y="184" fill="#a78bfa" font-family="'Courier New', Courier, monospace" font-size="16" opacity="0">
      <animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;0.5;0.58;0.65;0.9;1" dur="7s" repeatCount="indefinite"/>
