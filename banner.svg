<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="Talyson Souza Gomes - Desenvolvedor Backend Python">
  <defs>
    <clipPath id="round"><rect width="1000" height="220" rx="14"/></clipPath>
    <clipPath id="typing">
      <rect x="60" y="66" width="0" height="56">
        <animate attributeName="width" values="0;458;458;0" keyTimes="0;0.45;0.9;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="220" fill="#12061f"/>
    <rect width="1000" height="44" fill="#1d0a35"/>
    <circle cx="30" cy="22" r="6" fill="#6d28d9"/>
    <circle cx="52" cy="22" r="6" fill="#8b5cf6"/>
    <circle cx="74" cy="22" r="6" fill="#c4b5fd"/>
    <text x="500" y="27" text-anchor="middle" fill="#8b7bb5" font-family="'Courier New', Courier, monospace" font-size="13">Talysonsouzadevpy@gmail.com</text>

    <text x="60" y="108" fill="#ffffff" font-family="'Courier New', Courier, monospace" font-size="36" clip-path="url(#typing)">&gt; Talyson Souza Gomes</text>

    <rect y="74" width="14" height="38" fill="#c4b5fd">
      <animate attributeName="x" values="60;518;518;60" keyTimes="0;0.45;0.9;1" dur="7s" repeatCount="indefinite"/>
